<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 620" width="112mm"
     class="mfig" role="img" font-family="'Noto Serif JP','Noto Sans JP',serif">
<title>二つの道——浅い文明と深い文明、そのあいだに働く淘汰圧</title>
<desc>出力の規模を増やす道は二つある。対比の要は二つ——漏斗の深さと、漏斗の底の広さである。左＝浅い文明（底面積を広げる道）。作動圏は広く、しかし浅い。広く浅い漏斗が作動圏をよく充たすので殻は薄く、これが出力 小の幾何的指標になる。立てるコストは小さい（既存の漏斗の横展開）。頓死リスクは低いが、有効勾配が低いため同じ出力に大量の素材を要し、掘り尽くしが速い。編入できる外側が尽きれば、この道は閉じる。右＝深い文明（深く掘り込む道）。作動圏は狭く、しかし倍近く深い。漏斗は急峻に絞られ、底は細い一筋にまでなる——単位素材あたりの抽出が大きいということである。そのぶん殻は加速度的に膨らみ、これが出力 大の幾何的指標になる。立てるコストは大きく（新しい縮約段の組み上げ）、頓死リスクは非線形に増す。出力の伸びは Stock 掘り崩しの嵩上げを含みうる。外部 F を伴わない深掘りは、自己言及相へ向かう。左右の縦の矢印は縮約が及ぶ深さ、右端の楔は頓死リスクで、いずれも幅と長さで量を示してある——濃さは使わない。中央の矢印は淘汰圧。出力の差によって、深い文明が浅い文明を競争排除する。淘汰圧は、出力を見て、出力の地を見ない。</desc>
<style>
.mfig .omega {fill:none;stroke:var(--c-terrain,#A8A69C);stroke-width:1.11;stroke-dasharray:3.48 6.27}
.mfig .act   {fill:none;stroke:var(--c-struct,#3D3A34);stroke-width:1.47;stroke-opacity:0.62}
.mfig .funnel{fill:none;stroke:var(--c-op,#3D3A34);stroke-width:2.21;stroke-linejoin:round}
.mfig .fFun{fill:#3D3A34;fill-opacity:0.25;stroke:none}
.mfig .fShl{fill:#3D3A34;fill-opacity:0.13;stroke:none}
.mfig .ax  {fill:none;stroke:var(--c-struct,#3D3A34);stroke-width:1.47}
.mfig .sel {fill:none;stroke:#1F1E1B;stroke-width:2.7;stroke-linecap:round}
.mfig .lb{text-anchor:middle}
.mfig .ld{fill:none;stroke:var(--c-note,#6F6D66);stroke-width:0.98;stroke-dasharray:13.93 8.36}
.mfig text{fill:var(--c-ink,#1F1E1B)}
.mfig .halo{paint-order:stroke;stroke:#ffffff;stroke-width:4.18;stroke-linejoin:round}
</style>



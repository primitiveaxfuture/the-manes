<text x="195" y="86" font-size="20.88" class="lb" font-weight="700">浅い文明</text>
<text x="585" y="86" font-size="20.88" class="lb" font-weight="700">深い文明</text>
<text x="195" y="128" font-size="17.2" class="lb">底面積を広げる道</text>
<text x="585" y="128" font-size="17.2" class="lb">深く掘り込む道</text>
<text x="195" y="268" font-size="20.88" class="lb" font-weight="700">出力 小</text>
<text x="585" y="256" font-size="20.88" class="lb" font-weight="700">出力 大</text>
<text x="38" y="398" font-size="17.2" class="lb">浅い</text>
<text x="452" y="578" font-size="17.2" class="lb">深い</text>
<text x="353" y="398" font-size="17.2" class="lb">頓死リスク 低</text>
<text x="712" y="582" font-size="17.2" class="lb">頓死リスク 高</text>
<!-- 殻の名指し：薄い殻へは縦に、大きい殻へは横に -->
<text x="72" y="300" font-size="17.2" text-anchor="middle" transform="rotate(-90 72 300)">殻は薄い</text>
<text x="668" y="438" font-size="17.2">殻は大きい</text>
<!-- 淘汰圧＝矢印の真上に、矢先が隠れない隙間を取って置く -->
<text x="342" y="468" font-size="17.2" class="lb">淘汰圧——出力の差で働く</text>

<title>現実座標系——R空間 ⊃ Ω ⊃ F</title>
<desc>MANES のオーバーレイを載せる前の素の地形。外周の細い実線が R空間、その内の細い点線が接続可能圏 Ω、Ω の内に局在する波線の領域が Flux（F）である。この段階で現れる領域は二つだけ——F--（流動するが、どちらの錨も捉えていない）と ---（Ω 内のそれ以外）。塗りの濃さは、届いている錨の数を表す。</desc>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="112mm"
     class="mfig" role="img" font-family="'Noto Serif JP','Noto Sans JP',serif">
<title>失敗の星座——対称的に反対の二極</title>
<desc>星座の図。地が暗く、星と文字が明るい——夜空として読む版である。二つの明るい星が左右に離れて置かれ、そのあいだに一本の破線が張られている。破線は本書の声の線であり、二つの光点を一つの形として結んだのは表象する知性の側であることを示す——星座は世界の側に書き込まれてはいない。
左の極は固相化した特殊主義。「我ら」を特定の範囲に閉じて境界を固め、共有された現実への関与そのものを断つ極で、接地条件の破れが極限まで進んだ姿にあたり、地から浮いたまま自走する乖離へ向かう。右の極は空洞な普遍。実存的な厚みを伴わずに「我ら」を世界大に唱え、被覆が名目だけ広がる極で、被覆条件の破れの極限にあたり、宣言と実態の隔たりが臨界に達して撃たれる頓死へ向かう。二つは同じ終わり方をする二つではなく、対称的に反対の二つである。左右の配置は第24章の四つの位置の図に手勝手を揃えてある——あちらも乖離が左、頓死が右。ただし幾何は共有しない。あちらは全景の山、こちらは天球の配置である。
線の中央に、地と同じ色で抜かれた小さな円がある。これが MAN-I-ES で、二極のいずれにも滑落しない位置である。星ではない——失敗の星座を構成するのは二つの極であって、この位置は、その配置から輪郭を照らし出される側にある。位置が線の上に載っているのは、両者の張力の上に立つということであり、線に沿ってどちらへ流されているかが、そのまま測られる量になる。
位置の下に、出て戻る一本の弧がある。これが λ₀ である。読みを訂正するのは読みの内側ではなく、戻ってくる航海のほうであり、この弧が絶えれば、同じ配置が道具から判決に変わる。分かれるのは段の深さではなく、下に帰りがあるかどうかである。
散らばる小さな点は、この配置に流れ込む営みである。名は付いていない。それぞれが構造条件を運ぼうとして、一方の極へ力尽きつつある。いくつかの点から極へ向かって淡い軌跡が伸びているのは、力尽きていく途中を表す。名を書かないのは慎重さのためだけではない——星は入れ替わるからである。この配置に流れ込む営みは時代ごとに別の名で現れ、力尽き、別の営みがまた同じ軌道へ入る。強く現れているものが、本書の手が名において届いているものである。名を与えた二極と保つ位置だけが強く、営みの星々は弱い。
二つの極は、そこへ向かうための目標ではない。いま、どちらへ流されているかを測るための光である。</desc>

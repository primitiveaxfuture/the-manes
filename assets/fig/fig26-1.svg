<g class="halo">
<text x="450" y="156" font-size="24.1" text-anchor="middle" font-weight="700">MAN-I-ES</text>

<text x="180" y="242" font-size="24.1" text-anchor="middle" font-weight="700">固相化した特殊主義</text>
<text x="180" y="266" font-size="19.84" text-anchor="middle" class="sub">関与を断って——乖離へ</text>

<text x="720" y="242" font-size="24.1" text-anchor="middle" font-weight="700">空洞な普遍</text>
<text x="720" y="266" font-size="19.84" text-anchor="middle" class="sub">関与しすぎて——頓死へ</text>

<text x="450" y="338" font-size="19.84" text-anchor="middle" class="sub">出て、戻る——海が、歌を訂正する</text>

<text x="52" y="404" font-size="19.84" class="sub">光点は選ばれ、線は引かれる</text>
<text x="52" y="428" font-size="19.84" class="sub">——星座は、世界の側に書き込まれてはいない</text>
</g>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="112mm"
     class="mfig" role="img" font-family="'Noto Serif JP','Noto Sans JP',serif">
<title>乖離の軌道——重心の二段ドリフトと再生方向</title>
<desc>図16-3 の八セルのうえに、重心の軌道を重ねる。矢じりを塗った線が変性方向（O 先行）——FOE から、F–O 脱結合で -OE へ、E–O 脱結合で FO- へ分かれ、いずれも終端 -O-（二重丸）へ落ちる。-OE→-O- は消尽 Stock の引受が持続せず E が離脱する急性の経路、FO-→-O- は E なしには解体されず累積する慢性の経路である。矢じりを白く抜いた線が再生方向（E 先行）——F-E から FOE へ、live な流動のうえへ操作が追随して建て直される。健全さは O≤E の成否ではなく、E が先導し O が追随するという順序が成す。</desc>

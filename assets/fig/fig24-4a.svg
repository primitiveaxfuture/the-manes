<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 640" width="112mm"
     class="mfig" role="img" font-family="'Noto Serif JP','Noto Sans JP',serif">
<title>歩く者の地図——見えていた円と、歩かれた線</title>
<desc>第Ⅴ部の視点——地図を見ている主体から見える地図として描いた、文明の痩せ尾根。地図は SFOK 参照系の描画である。実測は現在地の一点（ラムダゼロ点 λ₀）のみで、手で確かめた範囲＝自分の錨泊 FOE はその近傍に限られる（現在地を囲む淡い円）。揺れた太い線は、別の誰かが実際に歩いた線——偶然にも左右されながら痩せ尾根の上を通った、一回性の歩みである。淡い円は、その歩き手たちの錨泊 FOE、すなわち彼らに見えていた広さ。見えていた円と歩かれた線は、同じではない——被覆と接地の差のミクロ版である。濃い線は接地しながらの歩みで、一歩ごとに足元を試す跡を伴う——遅いが外れにくい。淡い線は報告だけを信頼する歩みで、同じ投入でより速く遠くへ行ける（接地コストを払わない歩み・命題 FUNNEL-6）が、円の内・稜線の外に立ちうる。濃さは一貫して、手が届いているかを表す。背は幅のある尾根として描かれ、表面は現に均されている。盲点は、この地図の上では盲点として印されない。地図は縁で終わり、縁の外は外としてすら描かれない（命題 FUNNEL-3）——最上部の円が縁で切れているのは、見えていたものさえ縁が切り落とすことの姿である。枠の内のコメントは描かれているものについての注記、枠の外のコメントは地図そのものについてのメタ記述である。有限の帯域に、地形の全体は載らない——地図は、つねに近似である。A–A′ と B–B′ の断面は図24-4b が示す。</desc>

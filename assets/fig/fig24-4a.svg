<text x="164" y="512">現在地（λ₀）</text>
<text x="70" y="72">背は、幅のある尾根として描かれる</text>
<text x="70" y="96">円＝見えていた広さ／線＝歩かれた細さ</text>
<text x="296" y="518">濃い線＝接地しながらの歩み（遅い）</text>
<text x="296" y="542">淡い線＝報告だけを信頼する歩み（速い）</text>
</g>
<g class="haloW note" font-size="17.2">
<text x="574" y="48">地図は、縁で終わる</text>
<text x="574" y="72">——縁の外は、外と</text>
<text x="574" y="96">してすら描かれない</text>
<text x="574" y="158">盲点は、盲点として</text>
<text x="574" y="182">印されない</text>
</g>
</svg>

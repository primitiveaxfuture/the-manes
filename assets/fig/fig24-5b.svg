<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="112mm"
     class="mfig" role="img" font-family="'Noto Serif JP','Noto Sans JP',serif">
<title>乖離の二断面——覚えている地面と、いまの地面</title>
<desc>図24-5a の地図に引かれた二本の断面線を、実際の背として並べる。どちらの断面にも二本の地面がある。濃い実線が、地図が覚えている地面——系が記録として内に持っているものである。太く淡い線が、いまの地面——現に在るが、動いたぶんを掴む回路が内側にないため、手が届いていない。左＝A–A′、現在地の断面。覚えている地面といまの地面が、まだ重なっている。踏んで確かめた点も残っている——とはいえ、背は痩せている。右＝B–B′、古い地図にしたがい、都度の足元点検を省いて進んだ先の断面。二本の地面はここで離れる。歩み手は地図の稜線の上に立っているが、そこはいまの稜線の外である——地から浮く。現実に衝かれないまま、基盤が尽きるまで自走しうる。地図の上では、この二つの断面はどちらも同じ幅のある尾根として描かれる。濃さは一貫して、手が届いているかを表す。</desc>
<style>
.mfig .blank {fill:none;stroke:var(--c-terrain,#A8A69C);stroke-width:1.02}
.mfig .nowFill{fill:#1F1E1B;fill-opacity:0.05;stroke:none}
.mfig .now   {fill:none;stroke:#1F1E1B;stroke-width:3.63;stroke-opacity:0.30}
.mfig .remem {fill:none;stroke:var(--c-struct,#1F1E1B);stroke-width:2.04}
.mfig .tick  {fill:none;stroke:var(--c-struct,#3D3A34);stroke-width:1.13}
.mfig .ld    {fill:none;stroke:var(--c-note,#6F6D66);stroke-width:0.91;stroke-dasharray:12.86 7.71}
.mfig text{fill:var(--c-ink,#1F1E1B)}
.mfig .halo{paint-order:stroke;stroke:#ffffff;stroke-width:3.21;stroke-linejoin:round}
</style>


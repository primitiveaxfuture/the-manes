<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 645" width="112mm"
     class="mfig" role="img" font-family="'Noto Serif JP','Noto Sans JP',serif">
<title>健全な房——F の動きに応えられる分布</title>
<desc>F は縦長の領域として描かれ、粒はその中に浸かる——接地とは、F の領域の中に粒があることである。輪郭が波線なのは、F の境界が時間とともに動くからである。淡い波線が、ある時点の F。濃い波線が、ドリフトした後の F。漏斗は、ある時点の F に合わせて彫られたまま残る。健全な房では、漏斗の内は各深さまで粒で満たされ、浅いほど密に重なる——粒の重なりが媒介接続であり、重なった場所は濃くなる。漏斗の外の広い領域にも粒が散在する。ドリフトした後の F の中に、既に触れている粒がいる——漏斗の外の粒、すなわち報酬関数では報われない接地が、追随の資源になっている。粒の散らばりと F のドリフト量は、読み取りやすさのために実際より大きく描いてある——読むべきは分布の差であって、距離の量ではない。</desc>
<style>
.mfig .funnel{fill:none;stroke:var(--c-op,#3D3A34);stroke-width:2.08;stroke-linecap:round}
.mfig .funnelOpen{fill:none;stroke:var(--c-op,#3D3A34);stroke-width:2.08;stroke-opacity:0.35;stroke-linecap:round}
.mfig .fluxPast{fill:#3D3A34;fill-opacity:0.05;stroke:var(--c-fx,#3D3A34);stroke-width:1.21;stroke-opacity:0.35}
.mfig .fluxNow {fill:#3D3A34;fill-opacity:0.13;stroke:var(--c-fx,#3D3A34);stroke-width:1.56}
.mfig .grain{fill:url(#gr);stroke:#1F1E1B;stroke-width:0.52;fill-opacity:0.86}
.mfig .bone {fill:none;stroke:var(--c-terrain,#A8A69C);stroke-width:1.56;stroke-linecap:round}
.mfig .ld   {fill:none;stroke:var(--c-note,#6F6D66);stroke-width:0.69;stroke-dasharray:9.82 5.89}
.mfig .arw  {fill:none;stroke:var(--c-fx,#1F1E1B);stroke-width:1.73}
.mfig text{fill:var(--c-ink,#1F1E1B)}
.mfig .halo{paint-order:stroke;stroke:#ffffff;stroke-width:2.46;stroke-linejoin:round}
</style>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 800" width="112mm"
     class="mfig" role="img" font-family="'Noto Serif JP','Noto Sans JP',serif">
<title>F との重なりと、頓死リスク</title>
<desc>基本図（図17-1）の幾何のうえに、流動 F を重ねた派生図である。F は自らの軸を持つ独立の局在領域で、輪郭は波線——境界が時間とともに動くからであり、不定形なのは F の見えにくさによる。幅はおおむね一定で先細りせず、自軸方向の延びがある深さで尽きる。浅い領域では漏斗の口が F に広く浸かり、ずれを吸収する余地がある。深部は急峻に絞られ、その余地が消える——直接の重なりが尽きる深さである。殻に散る「?」は参照不能の差異で、深いほど大きく、数も多い。このどれかが系の生死を分けうるが、事前には特定できない。右の楔は頓死リスクで、殻の容積とともに非線形に増大する——濃さではなく幅で示してある。重なりの推移も、殻に落ちた差異も、系からは参照できない。</desc>

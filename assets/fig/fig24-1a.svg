<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" width="112mm"
     class="mfig" role="img" font-family="'Noto Serif JP','Noto Sans JP',serif">
<title>房と漏斗——接地の分布（健全な状態）</title>
<desc>左は λ の梯子。文明の作動は F からの距離に応じて段をなす——λ₀（個の F-E 接地・所与で、係留を要さない）／λ₁（共同体の F 追体験）／λ₂（信頼 SFOK。媒介 FOE はここから）／λ₃（蓄積への信頼＝外部知識ストック）／λ₄（SFOK 参照系への信頼）／λ₅（参照系の蓄積化＝世代を越えて手渡される圧）。段の区切りは房の背景まで延び、粒の位置がどの深さの対象への接地かを読ませる。中央は房と漏斗。太い実線が漏斗＝文明の出力の構造（O）で、下端の淡い区間は管が続いていることを示す。粒の一つひとつが個の主体とその接地である。健全な状態では、漏斗の内は各深さまで粒で満たされている——どの段にも、その段の対象に直接触れる手がある。浅い領域ほど粒は密に重なり合い、重なった場所は濃くなる。粒の重なりが媒介接続だからである。深い段ほど重なりは減り、粒は孤立して接地する。漏斗の外にも粒が分布する——報酬関数では報われない接地であり、社会的 LEFFLA の担い手である。粒は簡略に円で描いてある。精密には、各粒は有限個の軸で世界を切り取る多面体である。</desc>
<style>
.mfig .funnel{fill:none;stroke:var(--c-op,#3D3A34);stroke-width:4.06;stroke-linecap:round}
.mfig .funnelOpen{fill:none;stroke:var(--c-op,#3D3A34);stroke-width:4.06;stroke-opacity:0.35;stroke-linecap:round}
.mfig .step {fill:none;stroke:var(--c-note,#6F6D66);stroke-width:1.16;stroke-dasharray:16.43 9.86}
.mfig .ld   {fill:none;stroke:var(--c-note,#6F6D66);stroke-width:1.16;stroke-dasharray:16.43 9.86}
.mfig .ax   {fill:none;stroke:var(--c-struct,#3D3A34);stroke-width:1.74}
.mfig .grain{fill:url(#gr);stroke:#1F1E1B;stroke-width:0.87;fill-opacity:0.86}
.mfig text{fill:var(--c-ink,#1F1E1B)}
.mfig .halo{paint-order:stroke;stroke:#ffffff;stroke-width:4.11;stroke-linejoin:round}
</style>

.mfig .st{fill:none;stroke-width:2.2;stroke-linejoin:round}
.mfig .op{stroke:var(--c-op,#3D3A34)}
.mfig .ex{stroke:var(--c-ex,#3D3A34);stroke-dasharray:20.77 6.92 3.46 6.92}
.mfig .fx{stroke:var(--c-fx,#3D3A34)}
.mfig .fa{fill:#3D3A34;fill-opacity:0.13;stroke:none}
.mfig .tr{fill:none;stroke:var(--c-terrain,#A8A69C);stroke-width:1.1}
.mfig .om{stroke-dasharray:3.46 6.23}
.mfig .lb{fill:var(--c-ink,#1F1E1B);text-anchor:middle;font-weight:700;letter-spacing:.06em}
.mfig .cg{fill:var(--c-ink,#111)}
.mfig .ld{fill:none;stroke:var(--c-note,#6F6D66);stroke-width:0.98;stroke-dasharray:13.85 8.31}
.mfig .tj{fill:none;stroke:#111;stroke-width:2.93;stroke-linecap:round}
.mfig text{fill:var(--c-ink,#1F1E1B)}
</style>

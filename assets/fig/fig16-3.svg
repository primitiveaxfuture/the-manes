<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" width="78mm"
     class="mfig" role="img" font-family="'Noto Serif JP','Noto Sans JP',serif">
<title>Flux・操作O・実存E のスナップショット——八セルと重心</title>
<desc>三集合が接続可能圏 Ω の内で重なり、八つのセルをなす。FOE（三つとも及ぶ）／FO-（引受が及ばない）／F-E（操作が未到達）／F--（どちらの錨も捉えない）／-OE（固定され操作も引受も及ぶ）／-O-（固定され引受が及ばない）／--E（操作の届かない畏敬）／---（どの錨も届かない脱落域＝LOT）。黒点は重心＝高精度保持域であり、本来の座は FOE にある。線種が集合を分ける——F は波線（境界が時間とともに動く）、O は実線（届くか届かないかの二値）、E は一点鎖線（引き受けが引く境界）。塗りの濃さは、届いている錨の数を表す——三つとも届く FOE が最も濃く、どれも届かない --- が白い。</desc>

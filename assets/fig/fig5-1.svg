<path class="mv" d="M 133.3,411.3 C 206.7,220.7 324,543.3 426.7,279.3"/><path class="mv" d="M 177.3,220.7 C 353.3,264.7 162.7,470 397.3,470"/><path class="mv" d="M 111.3,338 C 250.7,411.3 280,191.3 448.7,382"/><path class="mv" d="M 221.3,528.7 C 280,396.7 397.3,484.7 353.3,206"/><path class="mv" d="M 148,294 C 324,338 206.7,426 412,220.7"/>
<path class="bind" d="M560,340 L650,340"/><path d="M623.43,356.61 L656.64,340 L623.43,323.39 z" fill="#3D3A34" stroke="none"/>
<text class="lb" x="605" y="318" font-size="27.34">三要素で</text>
<text class="lb" x="605" y="372" font-size="27.34">バインド</text>
<text class="lb" x="960" y="46" font-size="33.2" font-weight="700">バインドの後</text>
<text class="lb" x="960" y="72" font-size="27.34">盤の上に勾配と底が立つ</text>
<circle class="terrain" cx="960" cy="360" r="220"/>
<path class="mvOut" d="M 813.3,411.3 C 886.7,220.7 1004,543.3 1106.7,279.3"/><path class="mvOut" d="M 857.3,220.7 C 1033.3,264.7 842.7,470 1077.3,470"/><path class="mvOut" d="M 791.3,338 C 930.7,411.3 960,191.3 1128.7,382"/><path class="mvOut" d="M 901.3,528.7 C 960,396.7 1077.3,484.7 1033.3,206"/><path class="mvOut" d="M 828,294 C 1004,338 886.7,426 1092,220.7"/>
<rect x="810" y="240" width="300" height="250" fill="#ffffff"/>
<rect class="f1" x="810" y="240" width="300" height="250"/>
<rect class="struct" x="810" y="240" width="300" height="250"/>

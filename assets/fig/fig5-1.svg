<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" width="112mm"
     class="mfig" role="img" font-family="'Noto Serif JP','Noto Sans JP',serif">
<title>バインドによる盤面——現実の運動と、盤の上に立つ勾配と底</title>
<desc>細い実線の円が R空間（現実）である。左——バインドの前。現実の運動は絡み合い、勾配はまだどこにも立っていない。右——戦略空間・利得関数・プレイヤーの三要素を確定すると、現実より狭く切り出された盤が立つ。盤は二人二手の格子で、太い矢印は一方的な手替えの向きを示す。四本すべてが右下の一つの升へ向かい、そこが底（均衡）である。盤の外の運動は淡く描いてある——現実としては続いているが、盤の上では勾配ゼロであり、均衡を動かさない。軽んじられているのではなく、均衡に対して存在しない。各升の利得は本文の表に置く。</desc>
<style>
.mfig .terrain{fill:none;stroke:var(--c-terrain,#A8A69C);stroke-width:1.76}
.mfig .struct {fill:none;stroke:var(--c-struct,#3D3A34);stroke-width:3.52;stroke-linejoin:round}
.mfig .bind   {fill:none;stroke:var(--c-struct,#3D3A34);stroke-width:5.08;stroke-linecap:round}
.mfig .f1{fill:#3D3A34;fill-opacity:0.13;stroke:none}
.mfig .ld{fill:none;stroke:var(--c-note,#6F6D66);stroke-width:1.56;stroke-dasharray:22.14 13.29}
.mfig .ax0{fill:none;stroke:var(--c-terrain,#A8A69C);stroke-width:1.37;stroke-opacity:0.55}
.mfig .mv{fill:none;stroke:var(--c-struct,#3D3A34);stroke-width:2.15}
.mfig .mvOut{fill:none;stroke:var(--c-terrain,#A8A69C);stroke-width:2.15}
.mfig .grid{fill:none;stroke:var(--c-struct,#3D3A34);stroke-width:1.95}
.mfig .lb{fill:var(--c-ink,#1F1E1B);text-anchor:middle}
.mfig text{fill:var(--c-ink,#1F1E1B)}
</style>
<text class="lb" x="280" y="46" font-size="33.2" font-weight="700">バインドの前</text>
<text class="lb" x="280" y="72" font-size="27.34">勾配は、まだどこにも立っていない</text>
<circle class="terrain" cx="280" cy="360" r="220"/>

<path d="M1035,339 L1035,391"/>
</g><path d="M959.43,319.11 L992.64,302.5 L959.43,285.89 z" fill="#3D3A34" stroke="none"/><path d="M959.43,444.11 L992.64,427.5 L959.43,410.89 z" fill="#3D3A34" stroke="none"/><path d="M868.39,364.43 L885,397.64 L901.61,364.43 z" fill="#3D3A34" stroke="none"/><path d="M1018.39,364.43 L1035,397.64 L1051.61,364.43 z" fill="#3D3A34" stroke="none"/>
<ellipse cx="1035" cy="427.5" rx="58" ry="42" fill="none" stroke="#1F1E1B" stroke-width="4.3"/>
<g class="ld"><path d="M1178,556 L1116,500"/><path d="M746,596 L806,516"/></g>
<text class="lb" x="1168" y="582" font-size="27.34">底（均衡）</text>
<text class="lb" x="746" y="622" font-size="27.34">盤の外（勾配ゼロ）</text>
</svg>

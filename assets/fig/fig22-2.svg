.mfig .om{stroke-dasharray:2.74 4.93}
.mfig .lb{fill:var(--c-ink,#1F1E1B);text-anchor:middle;font-weight:700;letter-spacing:.06em}
.mfig .cg{fill:var(--c-ink,#111)}
.mfig .ld{fill:none;stroke:var(--c-note,#6F6D66);stroke-width:0.77;stroke-dasharray:10.95 6.57}
.mfig .tj{fill:none;stroke:#111;stroke-width:2.32;stroke-linecap:round}
.mfig text{fill:var(--c-ink,#1F1E1B)}
</style>

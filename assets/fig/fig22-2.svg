<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" width="98.6mm"
     class="mfig" role="img" font-family="'Noto Serif JP','Noto Sans JP',serif">
<title>八セルのセル分解——リターン・リスク・コスト</title>
<desc>操作（O）の報酬関数で八セルを読むと、三つの面はセルの別の側に立つ。R＝リターン＝O∩F（FOE・FO-）／K＝リスク＝O∩¬F（-OE・-O-）／C＝コスト＝E を含む全セル（FOE・F-E・-OE・--E）。リターンの面では FO- が FOE を上回り、-O- が -OE を上回る——いずれも引受のコストを負わないぶん高い。すなわち引受（E）はリターンに現れず、コストにのみ現れる。操作の論理は、構造的に O＞E の側へ引く。どのセルに立つかの規定であって、序列の規定ではない。</desc>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" width="78mm"
     class="mfig" role="img" font-family="'Noto Serif JP','Noto Sans JP',serif">
<title>本書の基底構造——R空間 ⊇ Ω ＝ LEFFLA ＋ LOT ＋ 未分化領域</title>
<desc>入れ子の二重円。外側の細い実線の円が R空間——全方向に等方な参照枠である。その内側に、点線の円 Ω がある。Ω は接続可能圏、すなわち構造的・反応的・意味的に接続しうる範囲の全体で、R空間の真部分集合として描いてある。二つの円のあいだの環は Ω の外であり、そもそも接続できない領域——その系にとっては存在しない。
Ω の内側は三つに分かれる。天から下へ一本の太い実線が入っていて、これが選別構造である。線の左が LEFFLA——参照されており、なお再編の余地を残している有効領域。線の右が LOT——Ω の内側にありながら、選別構造によって参照から外された領域。一本の線を挟んで向かい合っているのは、何かが LEFFLA に入るとき別の何かが LOT に入る、という対の関係を線が担っているからである。
選別構造の線は、Ω の底までは届かない。線の下端より下は、どちらにも分節されていない未分化領域である。この領域には境界を引いていない——差異が入っていないことを、線を引かないことで示す。基底層に近づくほどこの領域は大きく、文明レイヤーへ上がるにつれて狭まり、LEFFLA と LOT の対が前面に出る。
濃さは、選別構造の手がどこまで届いているかを表す。LEFFLA が最も濃く、LOT はそれより淡く、未分化領域は塗られていない。LOT が塗られているのは、選別構造が一度触れたうえで外した領域だからであり、未分化領域が白いのは、まだ触れられてもいないからである。
この図が第一に示すのは、LOT が Ω の外側ではないことである。Ω の外は、そもそも接続できない。LOT は接続可能圏の内側にあり、信号としては届きうるし、物理的にも反応的にも近接しうる。にもかかわらず、選別構造の働きによって参照回路に入らない。うっかり見落としたのではなく、構造的に切り捨てられている。
第1章の三領域は、この分節の上に次のように載る。高精度保存域と低精度保持域は、いずれも LEFFLA に対応する。脱落域は、LOT と未分化領域の両方にまたがる——能動的に切り捨てられた領域と、まだ選別の手が及んでいない領域とに分かれる。</desc>

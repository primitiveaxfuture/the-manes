<g class="halo">
<text x="24" y="52" font-size="24.6" font-weight="700">R空間</text>
<text x="24" y="76" font-size="20.26" class="sub">全方向に等方な参照枠</text>

<text x="360" y="112" font-size="20.26" class="sub" text-anchor="middle">Ω の外＝接続できない</text>

<text x="232" y="242" font-size="24.6" text-anchor="middle" font-weight="700">LEFFLA</text>
<text x="232" y="266" font-size="20.26" text-anchor="middle" class="sub">参照され、なお</text>
<text x="232" y="288" font-size="20.26" text-anchor="middle" class="sub">再編の余地がある</text>

<text x="410" y="242" font-size="24.6" text-anchor="middle" font-weight="700">LOT</text>
<text x="410" y="266" font-size="20.26" text-anchor="middle" class="sub">参照から</text>
<text x="410" y="288" font-size="20.26" text-anchor="middle" class="sub">外された</text>

<text x="315" y="420" font-size="24.6" text-anchor="middle" font-weight="700">未分化領域</text>
<text x="315" y="444" font-size="20.26" text-anchor="middle" class="sub">選別が及ばない</text>

<text x="616" y="540" font-size="24.6" text-anchor="end" font-weight="700">Ω（接続可能圏）</text>
<text x="616" y="564" font-size="20.26" text-anchor="end" class="sub">原理的には接続しうる範囲</text>
</g>
</svg>

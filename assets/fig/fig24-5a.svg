<text x="574" y="72">の断面で凍っている</text>
<text x="574" y="96">——動いたぶんを掴む</text>
<text x="574" y="120">回路は、もう内にない</text>
<text x="574" y="182">凍っていることは、</text>
<text x="574" y="206">地図の上に現れない</text>

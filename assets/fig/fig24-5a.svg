<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 640" width="112mm"
     class="mfig" role="img" font-family="'Noto Serif JP','Noto Sans JP',serif">
<title>凍った地図——生きている地図と、同じ顔をしている</title>
<desc>図24-4a「歩く者の地図」の、乖離側の対図。同じ地図が、更新を止めた姿で描かれている。淡い円は描かれたまま残るが、その円を見ていた手は、もう「我ら」の内にいない——接地条件の破れである。文明が到達した線はここで止まり、これ以上は伸びない（矢先を持たない）。地図は古い接続可能圏 Ω の断面で凍っており、地形はそのあとも動きつづけている。太く淡い線が、いまの稜線である——地図には載っていない。淡いのは、動いたぶんを掴む回路が、もう内側にないからである。現に在るが、手は届いていない。淡い細い線は、古い地図にしたがい、都度の足元点検を省いて進む歩みで、その先が B である。現在地 A は現に接地している——とはいえ、痩せ尾根の上である。凍っていることは、この地図の上ではどこにも現れない——生きている地図と、同じ顔をしている。紙の色も図24-4a とまったく同じにしてある。見分けがつかないことが、この図の主張だからである。A–A′ と B–B′ の断面は図24-5b が示す。</desc>

<polygon class="s3" points="280,200 370,200 370,110 280,110"/><polygon class="s2" points="280,110 290,101.7 380,101.7 370,110"/><polygon class="s1" points="370,200 380,191.7 380,101.7 370,110"/><polygon class="edge" points="280,200 370,200 370,110 280,110"/><polygon class="edge" points="280,110 290,101.7 380,101.7 370,110"/><polygon class="edge" points="370,200 380,191.7 380,101.7 370,110"/>
<text class="lb" x="325" y="248" font-size="18.74" font-weight="700">Segregate-2</text>
<text class="lb" x="325" y="270" font-size="15.43">「実存的我ら」の縮退</text>
<path class="tr" d="M400,155 L493,155"/><path d="M478,164.38 L496.75,155 L478,145.63 z" fill="#3D3A34" stroke="none"/>
<g class="ref"><polygon points="505,200 595,200 595,110 505,110"/><polygon points="505,110 535,85 625,85 595,110"/><polygon points="595,200 625,175 625,85 595,110"/><path d="M535,175 L535,85"/><path d="M535,175 L625,175"/></g>
<polygon class="s3" points="505,200 595,200 595,170 505,170"/><polygon class="s2" points="505,170 515,161.7 605,161.7 595,170"/><polygon class="s1" points="595,200 605,191.7 605,161.7 595,170"/><polygon class="edge" points="505,200 595,200 595,170 505,170"/><polygon class="edge" points="505,170 515,161.7 605,161.7 595,170"/><polygon class="edge" points="595,200 605,191.7 605,161.7 595,170"/>
<text class="lb" x="550" y="248" font-size="18.74" font-weight="700">Segregate-3</text>
<text class="lb" x="550" y="270" font-size="15.43">選別されたホモデウス的</text>
<text class="lb" x="550" y="291" font-size="15.43">「我ら」の共同体</text>
</svg>

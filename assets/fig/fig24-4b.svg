<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" width="112mm"
     class="mfig" role="img" font-family="'Noto Serif JP','Noto Sans JP',serif">
<title>二つの断面——確かめてある背と、描けない背</title>
<desc>図24-4a の地図に引かれた二本の断面線を、実際の背として並べる。左＝A–A′、現在地の断面。紙の色を敷いてあるのは、歩く者が自らの足で確かめてあるからである——踏んで確かめた点が刻みで示され、岩の背も縁も知られている。右＝B–B′、遠くの断面。地の色を敷かないのは、この地図が描けないものだからである。均された表面の下は切れ落ちた背で、稜線は細く尖っている。稜線の上に立つ者と、円の内・稜線の外に立つ者がいる——後者は淡く描いてある。手が届いていないからである。境は、上からは測れない。地図の上では、この二つの断面はどちらも同じ幅のある尾根として描かれる。濃さは一貫して、手が届いているかを表す。</desc>
<style>
.mfig .paper {fill:#F2F0EA;stroke:var(--c-struct,#3D3A34);stroke-width:1.59}
.mfig .blank {fill:none;stroke:var(--c-terrain,#A8A69C);stroke-width:1.02}
.mfig .soil  {fill:#1F1E1B;fill-opacity:0.08;stroke:none}
.mfig .rock  {fill:#1F1E1B;fill-opacity:0.22;stroke:var(--c-terrain,#6B675E);stroke-width:1.13}
.mfig .surf  {fill:none;stroke:var(--c-struct,#3D3A34);stroke-width:1.81}
.mfig .snow  {fill:none;stroke:var(--c-terrain,#6B675E);stroke-width:1.13}
.mfig .tick  {fill:none;stroke:var(--c-struct,#3D3A34);stroke-width:1.13}
.mfig .cut   {fill:none;stroke:var(--c-struct,#1F1E1B);stroke-width:2.49}
.mfig .ld    {fill:none;stroke:var(--c-note,#6F6D66);stroke-width:0.91;stroke-dasharray:12.86 7.71}
.mfig text{fill:var(--c-ink,#1F1E1B)}
.mfig .halo{paint-order:stroke;stroke:#ffffff;stroke-width:3.21;stroke-linejoin:round}
</style>

<rect class="paper" x="8" y="88" width="336" height="176"/>
<rect class="blank" x="356" y="88" width="336" height="176"/>
<g class="halo" font-size="19.28" font-weight="700">
<text x="8" y="70">A–A′ 現在地の断面</text>
<text x="356" y="70">B–B′ 遠くの断面</text>
</g>
<g class="halo" font-size="15.88">
<text x="8" y="48">——自らの足で、確かめてある</text>
<text x="356" y="48">——この地図が、描けないもの</text>
</g>


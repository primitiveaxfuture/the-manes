<g class="halo" font-size="15.88">
<text x="412" y="112">稜線の上</text>
<text x="560" y="124">円の内・稜線の外</text>
<text x="30" y="250">A</text><text x="316" y="250">A′</text>
<text x="374" y="250">B</text><text x="674" y="250">B′</text>
<text x="412" y="250">境は、上からは測れない</text>
</g>
